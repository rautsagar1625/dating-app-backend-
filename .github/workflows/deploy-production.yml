name: Deploy — Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy (e.g. sha-abc1234)'
        required: true
        type: string
      skip_canary:
        description: 'Skip canary phase (emergency deploys only)'
        required: false
        type: boolean
        default: false

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY:   ghcr.io
  IMAGE_NAME: ${{ github.repository }}/api

jobs:
  # ── Pre-flight: verify image was deployed to staging ─────────────────────────
  preflight:
    name: Pre-flight Checks
    runs-on: ubuntu-latest
    steps:
      - name: Verify image tag format
        run: |
          if [[ ! "${{ inputs.image_tag }}" =~ ^sha-[a-f0-9]{7,40}$ ]]; then
            echo "ERROR: image_tag must be in format sha-<git-sha>"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Verify image exists in registry
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}"
          docker manifest inspect "$IMAGE" || (echo "Image $IMAGE not found"; exit 1)

  # ── Database migration (with approval gate) ───────────────────────────────────
  migrate-production:
    name: Production DB Migration
    runs-on: ubuntu-latest
    needs: preflight
    environment: production  # requires reviewer approval
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Preview migration diff
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: npx prisma migrate diff --from-schema-datasource --to-schema-datamodel --script || true

      - name: Run production migrations
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          ENVIRONMENT:  production
          CI:           true
          GITHUB_ACTOR: ${{ github.actor }}
        run: bash scripts/migrate-safe.sh

  # ── Canary deployment ─────────────────────────────────────────────────────────
  canary:
    name: Canary Deploy (10% traffic)
    runs-on: ubuntu-latest
    needs: migrate-production
    if: ${{ !inputs.skip_canary }}
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Deploy canary task definition
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"
          TASK_DEF=$(aws ecs describe-task-definition --task-definition velvet-api-canary --query taskDefinition)
          NEW_TASK_DEF=$(echo $TASK_DEF | python3 -c "
          import json, sys
          td = json.load(sys.stdin)
          td['containerDefinitions'][0]['image'] = '${IMAGE}'
          for k in ['taskDefinitionArn','revision','status','requiresAttributes','compatibilities','registeredAt','registeredBy']:
              td.pop(k, None)
          print(json.dumps(td))")
          NEW_ARN=$(aws ecs register-task-definition --cli-input-json "$NEW_TASK_DEF" --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster velvet-production --service velvet-api-canary --task-definition $NEW_ARN

      - name: Wait for canary stability (5 minutes)
        run: |
          aws ecs wait services-stable --cluster velvet-production --services velvet-api-canary
          echo "Canary stable — monitoring for 5 minutes"
          sleep 300

      - name: Check canary error rate
        env:
          GRAFANA_API_KEY: ${{ secrets.GRAFANA_API_KEY }}
          GRAFANA_URL:     ${{ secrets.GRAFANA_URL }}
        run: |
          ERROR_RATE=$(curl -sf \
            -H "Authorization: Bearer ${GRAFANA_API_KEY}" \
            "${GRAFANA_URL}/api/datasources/proxy/1/api/v1/query?query=rate(http_requests_total{status=~\"5..\",job=\"velvet-api-canary\"}[5m])/rate(http_requests_total{job=\"velvet-api-canary\"}[5m])" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['data']['result'][0]['value'][1] if d['data']['result'] else '0')" 2>/dev/null || echo "0")
          echo "Canary error rate: ${ERROR_RATE}"
          if python3 -c "import sys; sys.exit(0 if float('${ERROR_RATE}') < 0.05 else 1)"; then
            echo "Canary healthy — proceeding to full deployment"
          else
            echo "ERROR: Canary error rate ${ERROR_RATE} exceeds 5% threshold"
            exit 1
          fi

  # ── Full production deployment ────────────────────────────────────────────────
  deploy-production:
    name: Full Production Deploy
    runs-on: ubuntu-latest
    needs: [migrate-production, canary]
    if: always() && needs.migrate-production.result == 'success' && (needs.canary.result == 'success' || needs.canary.result == 'skipped')
    environment: production
    outputs:
      previous_task_def: ${{ steps.get-previous.outputs.task_def_arn }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Get current task definition (for rollback)
        id: get-previous
        run: |
          PREV=$(aws ecs describe-services --cluster velvet-production --services velvet-api \
            --query 'services[0].taskDefinition' --output text)
          echo "task_def_arn=$PREV" >> $GITHUB_OUTPUT
          echo "Previous task definition: $PREV"

      - name: Deploy to production
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"
          TASK_DEF=$(aws ecs describe-task-definition --task-definition velvet-api --query taskDefinition)
          NEW_TASK_DEF=$(echo $TASK_DEF | python3 -c "
          import json, sys
          td = json.load(sys.stdin)
          td['containerDefinitions'][0]['image'] = '${IMAGE}'
          for k in ['taskDefinitionArn','revision','status','requiresAttributes','compatibilities','registeredAt','registeredBy']:
              td.pop(k, None)
          print(json.dumps(td))")
          NEW_ARN=$(aws ecs register-task-definition --cli-input-json "$NEW_TASK_DEF" --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster velvet-production --service velvet-api --task-definition $NEW_ARN

      - name: Wait for deployment stability
        run: |
          aws ecs wait services-stable --cluster velvet-production --services velvet-api
        timeout-minutes: 15

      - name: Production smoke tests
        env:
          BASE_URL: ${{ secrets.PROD_API_URL }}
        run: |
          curl -sf "${BASE_URL}/live" | grep -q '"status":"ok"' || exit 1
          curl -sf "${BASE_URL}/ready" | grep -q '"status":"ok"' || exit 1
          echo "Production smoke tests passed"

  # ── Rollback on failure ───────────────────────────────────────────────────────
  rollback:
    name: Auto-Rollback
    runs-on: ubuntu-latest
    needs: deploy-production
    if: failure() && needs.deploy-production.outputs.previous_task_def != ''
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Rollback to previous task definition
        run: |
          aws ecs update-service \
            --cluster velvet-production \
            --service velvet-api \
            --task-definition ${{ needs.deploy-production.outputs.previous_task_def }}
          aws ecs wait services-stable --cluster velvet-production --services velvet-api
          echo "Rollback complete"

      - name: Alert on rollback
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "🔄 *Production ROLLED BACK* — Deploy of `${{ inputs.image_tag }}` failed. Reverted to previous version. <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ── Post-deploy notification ──────────────────────────────────────────────────
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: deploy-production
    if: always()
    steps:
      - name: Success notification
        if: needs.deploy-production.result == 'success'
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "🚀 *Production deployed* — `${{ inputs.image_tag }}` by ${{ github.actor }}",
              "blocks": [{
                "type": "section",
                "text": { "type": "mrkdwn", "text": "🚀 *Production deploy succeeded*\nImage: `${{ inputs.image_tag }}`\nDeployed by: ${{ github.actor }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>" }
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
