apiVersion: v1
kind: Namespace
metadata:
  name: velvet
  labels:
    app.kubernetes.io/name: velvet
    environment: production
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: velvet-quota
  namespace: velvet
spec:
  hard:
    pods:            "50"
    requests.cpu:    "20"
    requests.memory: "40Gi"
    limits.cpu:      "40"
    limits.memory:   "80Gi"
    services:        "20"
    persistentvolumeclaims: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: velvet-limits
  namespace: velvet
spec:
  limits:
    - type: Container
      default:
        cpu:    "500m"
        memory: "512Mi"
      defaultRequest:
        cpu:    "100m"
        memory: "128Mi"
      max:
        cpu:    "4"
        memory: "8Gi"
      min:
        cpu:    "50m"
        memory: "64Mi"
