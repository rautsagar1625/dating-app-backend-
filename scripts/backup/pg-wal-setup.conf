# postgresql.conf additions for WAL archiving + PITR.
# Merge these into your postgresql.conf or mount as a ConfigMap override.
# Requires wal-g binary in PATH.

# ── WAL archiving ─────────────────────────────────────────────────────────────
wal_level                  = replica
archive_mode               = on
archive_timeout            = 60        # archive incomplete WAL segments every 60s → max 60s data loss
archive_command            = 'wal-g wal-push %p'
archive_status_directory   = '/var/lib/postgresql/data/archive_status'

# ── PITR restore (used in recovery.conf / postgresql.auto.conf) ───────────────
# restore_command          = 'wal-g wal-fetch "%f" "%p"'
# recovery_target_time     = '2026-05-12 14:00:00 UTC'   # uncomment for PITR restore
# recovery_target_action   = 'promote'

# ── Replication settings (for physical standbys) ──────────────────────────────
max_wal_senders            = 5
wal_keep_size              = 256MB     # local WAL buffer before archiving
hot_standby                = on

# ── Checkpointing ─────────────────────────────────────────────────────────────
checkpoint_completion_target = 0.9
max_wal_size               = 1GB
min_wal_size               = 256MB
