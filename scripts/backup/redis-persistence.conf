# redis.conf additions for production-grade persistence.
# Both RDB (snapshot) and AOF (append-only file) are enabled.
# RDB gives fast restores; AOF gives durability between snapshots.

# ── RDB snapshots ─────────────────────────────────────────────────────────────
save 3600 1       # save if 1 key changed in 60 minutes
save 300 100      # save if 100 keys changed in 5 minutes
save 60 10000     # save if 10000 keys changed in 1 minute
dbfilename dump.rdb
dir /data

# ── AOF (Append-Only File) ────────────────────────────────────────────────────
appendonly yes
appendfilename appendonly.aof
appenddirname appendonlydir   # Redis 7+: AOF files go in a dedicated subdirectory
appendfsync everysec           # fsync every second — good balance of durability vs perf
no-appendfsync-on-rewrite yes  # don't block fsync during BGREWRITEAOF
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-use-rdb-preamble yes       # hybrid format: faster load time

# ── Data durability ───────────────────────────────────────────────────────────
rdbcompression yes
rdbchecksum yes
stop-writes-on-bgsave-error yes  # fail loudly if persistence is broken

# ── Memory policy (for BullMQ queue data — do NOT evict) ─────────────────────
maxmemory-policy noeviction

# ── Cluster (enable if running Redis Cluster) ─────────────────────────────────
# cluster-enabled yes
# cluster-config-file nodes.conf
# cluster-node-timeout 5000
